<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 416" width="1000" height="416" role="img" aria-labelledby="t d">
<title id="t">Dove ci siamo fermati</title>
<desc id="d">La campana D2 e una versione più ricca scartata, a 16, 20, 24 e 48 pixel.</desc>
<rect width="1000" height="416" fill="#FAF7EE"/>
<text x="24" y="40" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="26" fill="#2A2A26" font-weight="700">Dove ci siamo fermati</text><text x="24" y="62" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="15" fill="#6B6A62">Un passo oltre D2 (tratti più spessi, sfumature, filetti, luci) rende l'icona più «ricca» e peggiore.</text><text x="24" y="82" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="15" fill="#6B6A62">Lo abbiamo provato, e ci siamo fermati.</text><text x="60" y="106" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="16" fill="#2A2A26" font-weight="700">D2 (scelta)</text><rect x="52" y="126" width="32" height="32" rx="8" fill="#fff" stroke="#DB5F00" stroke-opacity=".5"/><g transform="translate(60 134) scale(0.6666666666666666)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 17V11.3A5.7 5.7 0 0 1 17.7 11.3V17L19.3 18.8H4.7Z" style="stroke:var(--im,#DB5F00)"/>
  <path d="M12 3.4V5.1" style="stroke:var(--im,#DB5F00)"/>
  <circle cx="12" cy="21" r="1.5" style="fill:var(--ia,#C0281D);stroke:var(--ia,#C0281D)" stroke-width="0.8"/></g><text x="68" y="180" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">16 px</text><rect x="112" y="126" width="36" height="36" rx="8" fill="#fff" stroke="#DB5F00" stroke-opacity=".5"/><g transform="translate(120 134) scale(0.8333333333333334)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 17V11.3A5.7 5.7 0 0 1 17.7 11.3V17L19.3 18.8H4.7Z" style="stroke:var(--im,#DB5F00)"/>
  <path d="M12 3.4V5.1" style="stroke:var(--im,#DB5F00)"/>
  <circle cx="12" cy="21" r="1.5" style="fill:var(--ia,#C0281D);stroke:var(--ia,#C0281D)" stroke-width="0.8"/></g><text x="130" y="184" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">20 px</text><rect x="182" y="126" width="40" height="40" rx="8" fill="#fff" stroke="#DB5F00" stroke-opacity=".5"/><g transform="translate(190 134) scale(1)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 17V11.3A5.7 5.7 0 0 1 17.7 11.3V17L19.3 18.8H4.7Z" style="stroke:var(--im,#DB5F00)"/>
  <path d="M12 3.4V5.1" style="stroke:var(--im,#DB5F00)"/>
  <circle cx="12" cy="21" r="1.5" style="fill:var(--ia,#C0281D);stroke:var(--ia,#C0281D)" stroke-width="0.8"/></g><text x="202" y="188" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">24 px</text><rect x="262" y="126" width="64" height="64" rx="8" fill="#fff" stroke="#DB5F00" stroke-opacity=".5"/><g transform="translate(270 134) scale(2)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 17V11.3A5.7 5.7 0 0 1 17.7 11.3V17L19.3 18.8H4.7Z" style="stroke:var(--im,#DB5F00)"/>
  <path d="M12 3.4V5.1" style="stroke:var(--im,#DB5F00)"/>
  <circle cx="12" cy="21" r="1.5" style="fill:var(--ia,#C0281D);stroke:var(--ia,#C0281D)" stroke-width="0.8"/></g><text x="294" y="212" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">48 px</text><text x="520" y="106" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="16" fill="#2A2A26" font-weight="700">Un passo oltre (scartato)</text><rect x="512" y="126" width="32" height="32" rx="8" fill="#fff" stroke="#9A988C" stroke-opacity=".5"/><g transform="translate(520 134) scale(0.6666666666666666)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="o10" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB45C"/><stop offset="1" stop-color="#DB5F00"/></linearGradient></defs><path d="M6.3 17V11.3A5.7 5.7 0 0 1 17.7 11.3V17L19.3 18.8H4.7Z" fill="url(#o10)" fill-opacity=".55" stroke="#DB5F00" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.6 17V11.3A4.4 4.4 0 0 1 16.4 11.3V17" fill="none" stroke="#fff" stroke-width="1" opacity=".7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.2 11A3 3 0 0 1 12 8.4" fill="none" stroke="#C0281D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="21" r="1.7" fill="#C0281D"/><path d="M12 3.1V5.2" stroke="#DB5F00" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.4 19.6H19.6" stroke="#C0281D" stroke-width="1" opacity=".5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="528" y="180" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">16 px</text><rect x="572" y="126" width="36" height="36" rx="8" fill="#fff" stroke="#9A988C" stroke-opacity=".5"/><g transform="translate(580 134) scale(0.8333333333333334)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="o11" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB45C"/><stop offset="1" stop-color="#DB5F00"/></linearGradient></defs><path d="M6.3 17V11.3A5.7 5.7 0 0 1 17.7 11.3V17L19.3 18.8H4.7Z" fill="url(#o11)" fill-opacity=".55" stroke="#DB5F00" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.6 17V11.3A4.4 4.4 0 0 1 16.4 11.3V17" fill="none" stroke="#fff" stroke-width="1" opacity=".7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.2 11A3 3 0 0 1 12 8.4" fill="none" stroke="#C0281D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="21" r="1.7" fill="#C0281D"/><path d="M12 3.1V5.2" stroke="#DB5F00" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.4 19.6H19.6" stroke="#C0281D" stroke-width="1" opacity=".5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="590" y="184" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">20 px</text><rect x="642" y="126" width="40" height="40" rx="8" fill="#fff" stroke="#9A988C" stroke-opacity=".5"/><g transform="translate(650 134) scale(1)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="o12" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB45C"/><stop offset="1" stop-color="#DB5F00"/></linearGradient></defs><path d="M6.3 17V11.3A5.7 5.7 0 0 1 17.7 11.3V17L19.3 18.8H4.7Z" fill="url(#o12)" fill-opacity=".55" stroke="#DB5F00" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.6 17V11.3A4.4 4.4 0 0 1 16.4 11.3V17" fill="none" stroke="#fff" stroke-width="1" opacity=".7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.2 11A3 3 0 0 1 12 8.4" fill="none" stroke="#C0281D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="21" r="1.7" fill="#C0281D"/><path d="M12 3.1V5.2" stroke="#DB5F00" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.4 19.6H19.6" stroke="#C0281D" stroke-width="1" opacity=".5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="662" y="188" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">24 px</text><rect x="722" y="126" width="64" height="64" rx="8" fill="#fff" stroke="#9A988C" stroke-opacity=".5"/><g transform="translate(730 134) scale(2)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="o13" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB45C"/><stop offset="1" stop-color="#DB5F00"/></linearGradient></defs><path d="M6.3 17V11.3A5.7 5.7 0 0 1 17.7 11.3V17L19.3 18.8H4.7Z" fill="url(#o13)" fill-opacity=".55" stroke="#DB5F00" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.6 17V11.3A4.4 4.4 0 0 1 16.4 11.3V17" fill="none" stroke="#fff" stroke-width="1" opacity=".7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.2 11A3 3 0 0 1 12 8.4" fill="none" stroke="#C0281D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="21" r="1.7" fill="#C0281D"/><path d="M12 3.1V5.2" stroke="#DB5F00" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.4 19.6H19.6" stroke="#C0281D" stroke-width="1" opacity=".5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="754" y="212" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">48 px</text><text x="24" y="240" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="15" fill="#2A2A26" font-weight="700">A 16 e 20 px:</text><text x="24" y="268" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="14.5" fill="#2A2A26">D2: la forma si legge, il battaglio stacca, il punto rosso è un punto.</text><text x="24" y="292" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="14.5" fill="#6B6A62">Un passo oltre: il contorno spesso chiude gli spazi (sparisce il vuoto), le sfumature impastano,</text><text x="24" y="316" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="14.5" fill="#6B6A62">il filetto rosso sembra una sbavatura. Più segno, meno segno leggibile.</text><text x="24" y="364" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="14.5" fill="#2A2A26" font-weight="700">Criteri per fermarsi: (1) leggibile a 16 px; (2) un solo punto di colore pieno; (3) gli spazi bianchi</text><text x="24" y="388" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="14.5" fill="#2A2A26" font-weight="700">restano aperti; (4) stessa massa visiva per tutte; (5) nessun dettaglio che non sopravviva alla riduzione.</text>
</svg>
