<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 394" width="1000" height="394" role="img" aria-labelledby="t d">
<title id="t">La sottrazione: la campana</title>
<desc id="d">Cinque passaggi dalla campana ricca di dettagli alla forma finale con un solo punto di colore.</desc>
<rect width="1000" height="394" fill="#FAF7EE"/>
<text x="24" y="40" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="26" fill="#2A2A26" font-weight="700">La sottrazione</text><text x="24" y="66" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="15" fill="#6B6A62">Come si arriva a un segno: si toglie, finché non si può togliere altro senza perdere la campana.</text><rect x="48" y="110" width="160" height="160" rx="14" fill="#fff" stroke="#E4DFD0" stroke-width="1"/><g transform="translate(64 126) scale(5.333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="22.2" rx="6.5" ry="1" fill="#000" opacity=".18"/><defs><linearGradient id="e9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE680"/><stop offset="1" stop-color="#E5A200"/></linearGradient></defs><path d="M6 16.5v-5.2a6 6 0 0 1 12 0v5.2l1.5 2h-15z" fill="url(#e9)" stroke="#6B4600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="20.4" r="1.9" fill="#E5A200" stroke="#6B4600" stroke-width="1.8"/><path d="M8.6 10.2c.4-1.6 1.6-2.6 3-2.8" stroke="#fff" stroke-width="1.4" opacity=".85" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 3.2v2" stroke="#6B4600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 9a9 9 0 0 1 2-4.5M21 9a9 9 0 0 0-2-4.5" stroke="#6B4600" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.4 16.5h13.2" stroke="#6B4600" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="128" y="298" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="14.5" fill="#2A2A26" font-weight="700" text-anchor="middle">1 · Tutto</text><text x="128" y="318" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">ombra, luce, bordo, battaglio, suoni</text><rect x="232" y="110" width="160" height="160" rx="14" fill="#fff" stroke="#E4DFD0" stroke-width="1"/><g transform="translate(248 126) scale(5.333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5v-5.2a6 6 0 0 1 12 0v5.2l1.5 2h-15z" fill="#F7C948" stroke="#6B4600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="20.4" r="1.9" fill="#F7C948" stroke="#6B4600" stroke-width="1.8"/><path d="M12 3.2v2" stroke="#6B4600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 9a9 9 0 0 1 2-4.5M21 9a9 9 0 0 0-2-4.5" stroke="#6B4600" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.4 16.5h13.2" stroke="#6B4600" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="312" y="298" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="14.5" fill="#2A2A26" font-weight="700" text-anchor="middle">2 · Via ombra e luce</text><text x="312" y="318" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">resta il contorno</text><rect x="416" y="110" width="160" height="160" rx="14" fill="#fff" stroke="#E4DFD0" stroke-width="1"/><g transform="translate(432 126) scale(5.333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5v-5.2a6 6 0 0 1 12 0v5.2l1.5 2h-15z" fill="none" stroke="#DB5F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="20.4" r="1.9" fill="none" stroke="#DB5F00" stroke-width="1.8"/><path d="M12 3.2v2" stroke="#DB5F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="496" y="298" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="14.5" fill="#2A2A26" font-weight="700" text-anchor="middle">3 · Via i suoni e il bordo</text><text x="496" y="318" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">una sola forma</text><rect x="600" y="110" width="160" height="160" rx="14" fill="#fff" stroke="#E4DFD0" stroke-width="1"/><g transform="translate(616 126) scale(5.333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 17V11.3A5.7 5.7 0 0 1 17.7 11.3V17L19.3 18.8H4.7Z" fill="none" stroke="#DB5F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="21" r="1.5" fill="none" stroke="#DB5F00" stroke-width="1.8"/><path d="M12 3.4V5.1" stroke="#DB5F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="680" y="298" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="14.5" fill="#2A2A26" font-weight="700" text-anchor="middle">4 · Stacco il battaglio</text><text x="680" y="318" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">uno spazio bianco (留白)</text><rect x="784" y="110" width="160" height="160" rx="14" fill="#fff" stroke="#DB5F00" stroke-width="2"/><g transform="translate(800 126) scale(5.333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 17V11.3A5.7 5.7 0 0 1 17.7 11.3V17L19.3 18.8H4.7Z" style="stroke:var(--im,#DB5F00)"/>
  <path d="M12 3.4V5.1" style="stroke:var(--im,#DB5F00)"/>
  <circle cx="12" cy="21" r="1.5" style="fill:var(--ia,#C0281D);stroke:var(--ia,#C0281D)" stroke-width="0.8"/></g><text x="864" y="298" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="14.5" fill="#2A2A26" font-weight="700" text-anchor="middle">5 · Un solo punto di colore</text><text x="864" y="318" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="12.5" fill="#6B6A62" text-anchor="middle">il battaglio, in cinabro</text><text x="24" y="364" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="14" fill="#6B6A62">«Complicare è facile, semplificare è difficile.» — Bruno Munari. Qui la sottrazione vale quanto il vuoto di un foglio cinese: il bianco fa parte del segno.</text>
</svg>
