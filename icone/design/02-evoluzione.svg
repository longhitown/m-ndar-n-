<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668" width="1000" height="668" role="img" aria-labelledby="t d">
<title id="t">L'evoluzione grafica delle icone</title>
<desc id="d">Fiamma, libro e campana in sei versioni: emoji tipica, A carta di riso, B giada, C sigillo, D sintesi, D2 finale.</desc>
<rect width="1000" height="668" fill="#FAF7EE"/>
<text x="24" y="40" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="26" fill="#2A2A26" font-weight="700">L'evoluzione grafica</text><text x="24" y="66" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="15" fill="#6B6A62">Tre icone, sei passaggi: dall'emoji che hanno tutti al segno di màndarínō.</text><text x="125" y="102" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="15" fill="#2A2A26" font-weight="700" text-anchor="middle">Emoji tipica</text><text x="125" y="600" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="13" fill="#6B6A62" text-anchor="middle">Piena, ombreggiata,</text><text x="125" y="618" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="13" fill="#6B6A62" text-anchor="middle">contorno scuro: il</text><text x="125" y="636" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="13" fill="#6B6A62" text-anchor="middle">linguaggio di tutti.</text><rect x="59" y="116" width="132" height="132" rx="14" fill="#fff" stroke="#E4DFD0" stroke-width="1"/><g transform="translate(73 130) scale(4.333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="f0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE066"/><stop offset=".55" stop-color="#FF8A00"/><stop offset="1" stop-color="#E02A1B"/></linearGradient></defs><path d="M12 3c.9 3.4 5 5.4 5 9.9a5 5 0 0 1-10 0c0-2 1-3.2 2-4.1.3 1.2 1 1.8 1.8 2C10.6 8.4 11 5.5 12 3z" fill="url(#f0)" stroke="#7A2E00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 19.2a2.3 2.3 0 0 1-2.3-2.3c0-1.3 1.2-2 2.3-3.2 1.1 1.2 2.3 1.9 2.3 3.2a2.3 2.3 0 0 1-2.3 2.3z" fill="#FFF3B0" stroke="none"/><ellipse cx="9.2" cy="14" rx=".9" ry="1.8" fill="#fff" opacity=".7"/></g><rect x=