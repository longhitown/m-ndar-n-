0" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="13" fill="#6B6A62" text-anchor="middle">Glifo libero, tutto</text><text x="757" y="618" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="13" fill="#6B6A62" text-anchor="middle">arancio: velo ovunque,</text><text x="757" y="636" font-family="system-ui, 'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="13" fill="#6B6A62" text-anchor="middle">cinabro sbavato.</text><rect x="691" y="116" width="132" height="132" rx="14" fill="#fff" stroke="#E4DFD0" stroke-width="1"/><g transform="translate(705 130) scale(4.333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.9 3.4 5 5.4 5 9.9a5 5 0 0 1-10 0c0-2 1-3.2 2-4.1.3 1.2 1 1.8 1.8 2C10.6 8.4 11 5.5 12 3z" fill="#F58A1F" fill-opacity=".2" stroke="#D95000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 19.2a2.3 2.3 0 0 1-2.3-2.3c0-1.3 1.2-2 2.3-3.2 1.1 1.2 2.3 1.9 2.3 3.2a2.3 2.3 0 0 1-2.3 2.3z" fill="#B8322A" stroke="#B8322A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="691" y="266" width="132" height="132" rx="14" fill="#fff" stroke="#E4DFD0" stroke-width="1"/><g transform="translate(705 280) scale(4.333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.6C7 4.6 10 5 12 6.8c2-1.8 5-2.2 8-1.2V18c-3-1-6-.6-8 1.3C10 17.4 7 17 4 18z" fill="#F58A1F" fill-opacity=".2" stroke="#D95000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 6.8v12.5" fill="none" stroke="#B8322A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="691" y="416" width="132" height="132" rx="14" fill="#fff" stroke="#E4DFD0" stroke-width="1"/><g transform="translate(705 430) scale(4.333333333333333)" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linej