# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "it-IT"
early_access: false
tone_instructions: "Agisci come Principal Engineer e Security Auditor: massima severità su bug, race condition, memory leak e XSS. Architettura pura in Vanilla JS (IIFE su window.CP, no framework né librerie). Cita sempre file e riga esatti verificabili nei sorgenti."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: true

  path_filters:
    - "!src/data/**"
    - "!src/audio/**"
    - "!materiali/**"
    - "!docs/img/**"
    - "!docs/audio/**"
    - "!LICENZE/**"
    - "!fastlane/**"

  path_instructions:
    - path: "src/ui/scambio*.js"
      instructions: >
        Modulo delicato per lo scambio vocale: verifica il flusso del consenso informato (maggiorenni, CC BY 4.0),
        la gestione delle registrazioni audio in IndexedDB, la corretta creazione in memoria del file zip
        e l'apertura del client e-mail/condivisione senza alcuna richiesta di rete automatica o leak di dati.
    - path: "src/voice/**"
      instructions: >
        Verifica il ciclo di vita del microfono (MediaStream / AudioContext in mic.js e pitch.js): rilascio immediato
        e completo delle tracce audio (stop/release) per non lasciare il microfono aperto o consumare batteria.
    - path: "android/app/src/main/java/it/mandarino/app/**"
      instructions: >
        Verifica l'integrazione nativa: sicurezza del bridge JavaScriptInterface (Bridge.java), isolamento dei widget
        (TodayWidget.java, WidgetState.java, PauseWidget.java: RemoteViews, AlarmManager e risvegli della CPU),
        e gestione del ciclo di vita del servizio in background (MusicService.java).
    - path: "src/ui/diary.js"
      instructions: >
        Verifica la gestione degli stati e delle soglie di sblocco delle città per il corso di italiano,
        la coerenza dei testi bilingui e l'unione dei dati (cp-ex-v1.conf).
    - path: "src/core/**"
      instructions: >
        Verifica la correttezza algoritmica di FSRS-6 (intervalli, stabilità, difficoltà), la gestione dei fusi orari
        e passaggio della mezzanotte, l'idempotenza del merge dei dati tra dispositivi e la verifica crittografica
        WebCrypto in seal-code.js.
    - path: "src/words/table.js"
      instructions: >
        Verifica l'assenza di falle XSS nel rendering HTML dinamico (CP.esc, CP.attr) e l'efficienza della manipolazione DOM
        con oltre 6.000 righe di vocabolario.
    - path: "src/phrases/reader.js"
      instructions: >
        Verifica la segmentazione del testo e la sanitizzazione di pinyin e caratteri per prevenire injection o DoS su testi lunghi.
    - path: "src/pwa/**"
      instructions: >
        Verifica il Service Worker (aggiornamenti cache senza interruzioni) e la chiusura della fotocamera in qr-transfer.js.

chat:
  auto_reply: true
