# màndarínō · APK Android, costruito gratis da GitHub a ogni modifica dell'app.
# - Costruisce dist/ (non sta nel repository) e controlla che le prove della grammatica passino.
# - Costruisce l'APK (android/), lo controlla con Android lint e lo allega alla corsa («Artifacts»).
# - Sul ramo principale, se ci sono i segreti della chiave di firma, pubblica una Release: il link
#   https://github.com/<utente>/<repository>/releases/latest/download/mandarino.apk scarica sempre l'ultima versione.
# Segreti (Settings → Secrets and variables → Actions): MD_KEYSTORE_B64 (la chiave, in base64) e MD_KEYSTORE_PASSWORD.
# Senza segreti l'APK è firmato con una chiave di prova: si installa, ma la versione dopo non si installerà sopra.
name: APK Android

on:
  push:
    paths: ["android/**", "src/**", "tools/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # per lanciare «pages» dopo una Release: il sito offre l'APK appena pubblicato

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # il numero di commit è il numero di versione dell'APK

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build di dist/ (app, brani, nomi e termini) e frasi verificate
        run: node tools/build.mjs && node tools/grammar.mjs && node tools/unit.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Chiave di firma
        env:
          MD_KEYSTORE_B64: ${{ secrets.MD_KEYSTORE_B64 }}
        run: |
          if [ -n "$MD_KEYSTORE_B64" ]; then
            echo "$MD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mandarino.jks"
            echo "MD_KEYSTORE=$RUNNER_TEMP/mandarino.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Nessuna chiave di firma nei segreti: APK di prova, non pubblicato come Release."
          fi

      - name: Costruisci e controlla l'APK
        env:
          MD_KEYSTORE_PASSWORD: ${{ secrets.MD_KEYSTORE_PASSWORD }}
        run: gradle -p android --no-daemon assembleDirectRelease assembleStoreRelease bundleStoreRelease lintDirectRelease lintStoreRelease

      - name: Verifica firma e contenuto
        run: |
          APK=android/app/build/outputs/apk/direct/release/app-direct-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Signer|SHA-256" || true
          "$BT/apksigner" verify "$APK"
          unzip -l "$APK" | grep -q "assets/www/index.html"
          VERSION=$("$BT/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          cp "$APK" mandarino.apk
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA=$(sha256sum mandarino.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: mandarino-${{ env.VERSION }}
          path: mandarino.apk

      # versione per gli store: il pacchetto .aab (Google Play) e l'APK «store», solo come artefatti della corsa (mai pubblicati da soli)
      - name: Pacchetto per gli store (.aab)
        run: |
          cp android/app/build/outputs/bundle/storeRelease/app-store-release.aab mandarino-store.aab
          cp android/app/build/outputs/apk/store/release/app-store-release.apk mandarino-store.apk
          VC=$(git rev-list --count HEAD)
          node tools/store-assets.mjs --notes "$VC"
          mkdir -p note && for L in it-IT zh-CN; do cp "fastlane/metadata/android/$L/changelogs/$VC.txt" "note/$L-$VC.txt"; done
          ls -l mandarino-store.aab mandarino-store.apk
          echo "Pacchetto per gli store: $(du -h mandarino-store.aab | cut -f1) (.aab)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mandarino-store-${{ env.VERSION }}
          path: |
            mandarino-store.aab
            mandarino-store.apk
            note/

      - name: Pubblica la Release
        if: env.SIGNED == '1' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          printf 'màndarínō %s per Android (8.0 o più recente).\n\nScarica **mandarino.apk**, aprilo e consenti l’installazione da questa fonte. Gli aggiornamenti si installano sopra la versione precedente senza perdere i progressi.\n\nSHA-256: `%s`\n' "$VERSION" "$SHA" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" mandarino.apk --clobber
          else
            gh release create "$TAG" mandarino.apk --title "màndarínō $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
          echo "Scarica: https://github.com/${{ github.repository }}/releases/latest/download/mandarino.apk" >> "$GITHUB_STEP_SUMMARY"
          # una Release creata con il token del workflow non lancia altri workflow da sola: si lancia «pages» a mano
          gh workflow run pages.yml --ref "$GITHUB_REF_NAME" || echo "pages.yml non lanciato (non è un problema: parte al prossimo push)"

  # Prova sul dispositivo: l'APK di prova gira in emulatori Android 14 e 16 (API 36, il livello richiesto da Google Play) veri (con l'accelerazione KVM dei runner
  # Linux di GitHub) e tools/android-smoke.mjs controlla dentro la WebView: caricamento, #selftest, backup in
  # Download, microfono, dati che restano, tasto Indietro, nessun crash.
  dispositivo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # WebSocket integrato, per parlare con la WebView

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Costruisci l'APK di prova
        run: node tools/build.mjs && gradle -p android --no-daemon assembleDirectDebug

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prova nell'emulatore (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            node tools/android-smoke.mjs android/app/build/outputs/apk/direct/debug/app-direct-debug.apk || { echo "::warning::smoke: primo tentativo fallito, ne faccio un secondo"; node tools/android-smoke.mjs android/app/build/outputs/apk/direct/debug/app-direct-debug.apk; }

      - name: Schermate dei widget (solo debug)
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: adb install -r -g android/app/build/outputs/apk/direct/debug/app-direct-debug.apk && sh tools/widget-shots.sh widget-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-shots-api${{ matrix.api }}
          path: widget-shots/
