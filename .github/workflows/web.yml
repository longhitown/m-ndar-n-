# màndarínō · prove dell'app web a ogni push e pull request:
# - prove veloci senza browser (tools/unit.mjs: taglio in parole, unione dei dati, peso dell'avvio);
# - dist/ aggiornato e frasi verificate (tools/build.mjs --check, tools/grammar.mjs);
# - prove nel browser vero (tools/e2e.mjs, tools/ux-audit.mjs) con Playwright, dichiarato in package.json.
name: web

on:
  push:
    paths: ["src/**", "tools/**", "dist/index.html", "package.json", ".github/workflows/web.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove veloci (senza browser)
        run: node tools/unit.mjs

      - name: dist/ aggiornato e frasi verificate
        run: node tools/build.mjs --check && node tools/grammar.mjs

      - name: Playwright e Chromium
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Build completa (anche i file pesanti) e prove nel browser
        run: node tools/build.mjs && node tools/e2e.mjs && node tools/ux-audit.mjs
