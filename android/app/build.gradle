plugins { id "com.android.application" }

/* versione: il numero di commit (sempre crescente: gli aggiornamenti si installano sopra) e la versione dell'app */
def gitCount = { ->
    try { return "git rev-list --count HEAD".execute(null, rootDir).text.trim().toInteger() } catch (ignored) { return 1 }
}
def vCode = (System.getenv("MD_VERSION_CODE") ?: gitCount().toString()).toInteger()

android {
    namespace "it.mandarino.app"
    compileSdk 34
    defaultConfig {
        applicationId "it.mandarino.app"
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName "6.7." + vCode
    }
    /* firma: con le variabili MD_KEYSTORE… (GitHub Actions, segreti del repository) la chiave è sempre la stessa e
       ogni nuova versione si installa sopra la vecchia senza perdere i progressi. Senza: chiave di debug. */
    signingConfigs {
        release {
            def ks = System.getenv("MD_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("MD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MD_KEY_ALIAS") ?: "mandarino"
                keyPassword System.getenv("MD_KEY_PASSWORD") ?: System.getenv("MD_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("MD_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    sourceSets { main { assets.srcDirs += "$buildDir/generated/web" } }
    lint {
        abortOnError true
        checkReleaseBuilds true
        disable "OldTargetApi", "GradleDependency", "AndroidGradlePluginVersion"
    }
}

/* l'app web: la build di tools/build.mjs (dist/) finisce nel pacchetto sotto assets/www/ */
def copyWeb = tasks.register("copyWeb", Sync) {
    from("${rootDir}/../dist") { exclude "sw.js", "_headers" }
    into "$buildDir/generated/web/www"
    doFirst {
        if (!file("${rootDir}/../dist/index.html").exists()) throw new GradleException("Manca dist/index.html: lancia prima «node tools/build.mjs».")
    }
}
tasks.named("preBuild") { dependsOn copyWeb }
